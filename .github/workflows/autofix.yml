name: Persist Dart Autofixes

on:
  push:
    branches:
      - feature/full-app-implementation

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/full-app-implementation

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap
        run: bash tool/bootstrap.sh

      - name: Apply safe fixes and format
        run: |
          dart fix --apply
          dart format lib test

      - name: Persist fixes
        run: |
          if git diff --quiet -- lib test; then
            echo 'No Dart autofixes to persist.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          git commit -m 'style: persist Dart analyzer fixes'
          git push origin HEAD:feature/full-app-implementation
