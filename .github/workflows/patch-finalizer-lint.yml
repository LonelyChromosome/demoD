name: Patch Release Finalizer Lints

on:
  push:
    branches:
      - feature/full-app-implementation
    paths:
      - '.github/workflows/patch-finalizer-lint.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-app-implementation
      - name: Add automated Dart fixes before release analysis
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/finalize-official-apk.yml')
          s = p.read_text(encoding='utf-8')
          old = """      - name: Format\n        run: dart format lib test\n\n      - name: Analyze\n        run: flutter analyze\n"""
          new = """      - name: Apply safe Dart fixes\n        run: dart fix --apply\n\n      - name: Format\n        run: dart format lib test\n\n      - name: Analyze\n        run: flutter analyze\n"""
          if old not in s:
              raise SystemExit('Finalizer format/analyze block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch and self-remove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/finalize-official-apk.yml
          git commit -m 'build: apply Dart fixes before release analysis'
          git rm .github/workflows/patch-finalizer-lint.yml
          git commit -m 'chore: remove one-shot finalizer patch'
          git push origin HEAD:feature/full-app-implementation
