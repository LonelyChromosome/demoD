name: Prep Official Release

on:
  push:
    branches:
      - feature/full-app-implementation
    paths:
      - '.github/workflows/prep-official-release.yml'

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-app-implementation
      - name: Remove remaining preview time branches
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/app/app.dart')
          s = p.read_text(encoding='utf-8')
          blocks = {
              """    final referenceNow = data.source == 'demo'\n        ? DateTime(2026, 8, 26, 6)\n        : DateTime.now();\n""": """    final referenceNow = DateTime.now();\n""",
              """    final reference = data.source == 'demo'\n        ? DateTime(2026, 8, 26, 6)\n        : DateTime.now();\n""": """    final reference = DateTime.now();\n""",
          }
          for old, new in blocks.items():
              if old not in s:
                  raise SystemExit('Expected preview-time block not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit prep
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app/app.dart
          git commit -m 'release: remove preview-only reference clocks'
          git rm .github/workflows/prep-official-release.yml
          git commit -m 'chore: remove one-shot release prep'
          git push origin HEAD:feature/full-app-implementation
