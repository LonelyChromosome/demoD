name: Build Better Phenikaa App v1.0.0

on:
  push:
    branches:
      - feature/full-app-implementation
    paths:
      - '.github/workflows/build-official-apk-now.yml'

permissions:
  contents: read

jobs:
  official-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout official source
        uses: actions/checkout@v4
        with:
          ref: feature/full-app-implementation

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap Android and dependencies
        run: bash tool/bootstrap.sh

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify official production source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 1.0.0+1$' pubspec.yaml
          grep -q 'android:label="Better Phenikaa App"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@drawable/ic_launcher_better_phenikaa"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'qldtbeta.phenikaa-uni.edu.vn' lib/features/qldt_intake/qldt_login_mobile.dart
          if grep -RniE '\bdemo\b|mockup' lib --include='*.dart'; then
            echo 'Production Dart still contains preview-only wording.' >&2
            exit 1
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Package official APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better_Phenikaa_App_v1.0.0.apk
          sha256sum dist/Better_Phenikaa_App_v1.0.0.apk > dist/Better_Phenikaa_App_v1.0.0.sha256
          test -s dist/Better_Phenikaa_App_v1.0.0.apk
          ls -lh dist

      - name: Upload Better Phenikaa App
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-v1.0.0
          path: |
            dist/Better_Phenikaa_App_v1.0.0.apk
            dist/Better_Phenikaa_App_v1.0.0.sha256
          retention-days: 30
          if-no-files-found: error
