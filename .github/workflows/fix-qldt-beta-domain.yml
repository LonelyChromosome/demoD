name: Fix QLDT beta domain

on:
  push:
    branches:
      - feature/full-app-implementation

permissions:
  contents: write

jobs:
  replace-domain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/full-app-implementation
          fetch-depth: 0

      - name: Replace legacy QLDT domain everywhere
        shell: bash
        run: |
          set -euo pipefail
          OLD="qldt"".""phenikaa-uni.edu.vn"
          NEW="qldtbeta"".""phenikaa-uni.edu.vn"
          python3 - "$OLD" "$NEW" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          old, new = sys.argv[1], sys.argv[2]
          result = subprocess.run(
              ['git', 'grep', '-Il', old],
              check=False,
              capture_output=True,
              text=True,
          )
          paths = [Path(line) for line in result.stdout.splitlines() if line.strip()]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  print(path)
          PY

      - name: Commit domain correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No legacy QLDT domain remains."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use qldtbeta Phenikaa endpoint"
          git push origin HEAD:feature/full-app-implementation
