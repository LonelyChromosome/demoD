name: Apply Interaction Upgrade

on:
  push:
    branches:
      - feature/full-app-implementation
    paths:
      - 'tool/apply_interaction_upgrade.py'
      - '.github/workflows/apply-interaction-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/full-app-implementation

      - name: Apply UI interaction upgrade
        run: python3 tool/apply_interaction_upgrade.py

      - name: Persist app changes
        run: |
          if git diff --quiet; then
            echo 'No interaction changes to persist.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app/app.dart
          git commit -m 'feat: add calendar picker slide transitions and radial menu'
          git push
