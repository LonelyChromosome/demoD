include: package:very_good_analysis/analysis_options.11.0.0.yaml

plugins:
  riverpod_lint: 3.1.9

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - '**/*.g.dart'
    - '**/*.freezed.dart'

linter:
  rules:
    public_member_api_docs: false
    # These two rules are stylistic only; disabling them keeps CI focused on
    # correctness while preserving readable Vietnamese UI strings and simple
    # imperative WebView code.
    lines_longer_than_80_chars: false
    cascade_invocations: false
